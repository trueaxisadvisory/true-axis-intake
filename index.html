<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>True Axis Intake Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --navy: #0a1529;
            --paper: #f5f1e8;
            --gold: #b8934a;
            --gold-deep: #8a6d28;
            --cream: #f0ead8;
            --ink: #111113;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--paper);
            color: var(--ink);
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .header {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 40px;
        }

        .compass {
            width: 60px;
            height: 60px;
            flex-shrink: 0;
        }

        h1 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 38px;
            color: var(--navy);
            font-weight: 600;
        }

        .subtitle {
            font-size: 12px;
            color: #999;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .status-message {
            padding: 12px 16px;
            margin-bottom: 20px;
            border-left: 4px solid;
            font-size: 13px;
            border-radius: 2px;
        }

        .status-loading {
            background: #e3f2fd;
            color: #1565c0;
            border-left-color: #1565c0;
        }

        .status-success {
            background: #e8f5e9;
            color: #2e7d32;
            border-left-color: #2e7d32;
        }

        .status-error {
            background: #ffebee;
            color: #c62828;
            border-left-color: #c62828;
        }

        .controls {
            margin-bottom: 30px;
        }

        .button {
            padding: 10px 18px;
            background: var(--gold);
            color: white;
            border: none;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-radius: 2px;
        }

        .button:hover {
            background: var(--gold-deep);
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 16px;
            margin-bottom: 30px;
        }

        .stat {
            background: white;
            padding: 20px;
            border: 1px solid #e0dbd0;
            text-align: center;
        }

        .stat-label {
            font-size: 11px;
            color: #999;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .stat-number {
            font-size: 32px;
            color: var(--navy);
            font-weight: 600;
        }

        .table-section {
            background: white;
            border: 1px solid #e0dbd0;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }

        thead {
            background: #f5f1e8;
            border-bottom: 1px solid #e0dbd0;
        }

        th {
            padding: 12px;
            text-align: left;
            font-weight: 600;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--navy);
        }

        td {
            padding: 12px;
            border-bottom: 1px solid #f0ebe0;
        }

        tbody tr:hover {
            background: #faf8f3;
        }

        .badge {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 2px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        .badge-active {
            background: #d4edda;
            color: #155724;
        }

        .badge-pending {
            background: #fff3cd;
            color: #856404;
        }

        .spinner {
            display: inline-block;
            animation: spin 1s linear infinite;
            margin-right: 6px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <svg class="compass" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                <circle cx="50" cy="50" r="48" fill="none" stroke="#b8934a" stroke-width="0.7" opacity="0.7"/>
                <circle cx="50" cy="50" r="40" fill="none" stroke="#b8934a" stroke-width="0.5" opacity="0.4"/>
                <line x1="50" y1="10" x2="50" y2="25" stroke="#b8934a" stroke-width="1.6"/>
                <line x1="50" y1="75" x2="50" y2="90" stroke="#b8934a" stroke-width="1.6"/>
                <line x1="10" y1="50" x2="25" y2="50" stroke="#8a6d28" stroke-width="1.6"/>
                <line x1="75" y1="50" x2="90" y2="50" stroke="#8a6d28" stroke-width="1.6"/>
                <circle cx="50" cy="50" r="1.6" fill="#b8934a"/>
            </svg>
            <div>
                <h1>Intake Dashboard</h1>
                <p class="subtitle">Weekly organizational alignment review</p>
            </div>
        </div>

        <div id="status" class="status-message status-loading">
            <span class="spinner">⟳</span> Loading data...
        </div>

        <div class="controls">
            <button class="button" onclick="refreshData()">🔄 Refresh Data</button>
        </div>

        <div class="stats" id="stats" style="display:none;">
            <div class="stat">
                <div class="stat-label">Total Intakes</div>
                <div class="stat-number" id="totalIntakes">0</div>
            </div>
            <div class="stat">
                <div class="stat-label">In Progress</div>
                <div class="stat-number" id="inProgress">0</div>
            </div>
            <div class="stat">
                <div class="stat-label">Active Leads</div>
                <div class="stat-number" id="activeLeads">0</div>
            </div>
            <div class="stat">
                <div class="stat-label">Needs Attention</div>
                <div class="stat-number" id="needsAttention">0</div>
            </div>
        </div>

        <div class="table-section" id="tableSection" style="display:none;">
            <table>
                <thead>
                    <tr>
                        <th>Lead Name</th>
                        <th>Organization</th>
                        <th>Service</th>
                        <th>Status</th>
                        <th>Alignment</th>
                        <th>Blocker</th>
                        <th>Date</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                </tbody>
            </table>
        </div>
    </div>

    <script>
        let data = null;

        async function loadData() {
            try {
                document.getElementById('status').innerHTML = '<span class="spinner">⟳</span> Loading data...';
                document.getElementById('status').className = 'status-message status-loading';
                
                const response = await fetch('./data/intakes.json?t=' + Date.now());
                if (!response.ok) throw new Error('Failed to load intakes.json');
                
                data = await response.json();
                
                document.getElementById('status').innerHTML = '✓ Data loaded at ' + new Date().toLocaleTimeString();
                document.getElementById('status').className = 'status-message status-success';
                
                displayData();
            } catch (error) {
                document.getElementById('status').innerHTML = '✗ Error: ' + error.message;
                document.getElementById('status').className = 'status-message status-error';
            }
        }

        function displayData() {
            document.getElementById('stats').style.display = 'grid';
            document.getElementById('tableSection').style.display = 'block';
            
            document.getElementById('totalIntakes').textContent = data.total_intakes || 0;
            document.getElementById('inProgress').textContent = data.in_progress || 0;
            document.getElementById('activeLeads').textContent = data.active_leads || 0;
            document.getElementById('needsAttention').textContent = data.needs_attention || 0;
            
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';
            
            if (!data.intakes || data.intakes.length === 0) {
                tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;padding:30px;color:#999;">No intakes yet</td></tr>';
                return;
            }
            
            data.intakes.forEach(intake => {
                const badgeClass = intake.contact_status === 'Active' ? 'badge-active' : 'badge-pending';
                const row = tbody.insertRow();
                row.innerHTML = `
                    <td><strong>${intake.lead_name || 'N/A'}</strong></td>
                    <td>${intake.organization || intake.department || 'N/A'}</td>
                    <td>${intake.must_win_task || 'N/A'}</td>
                    <td><span class="badge ${badgeClass}">${intake.contact_status || 'N/A'}</span></td>
                    <td>${intake.alignment_score !== undefined ? intake.alignment_score + '/10' : 'N/A'}</td>
                    <td>${intake.primary_blocker || 'None'}</td>
                    <td>${intake.submitted_date || 'N/A'}</td>
                `;
            });
        }

        function refreshData() {
            location.reload();
        }

        window.addEventListener('load', loadData);
    </script>
</body>
</html>
