name: Sync Intake Form Data from Gmail

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  sync-intakes:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Extract and process intake form data from Gmail
        env:
          GMAIL_API_KEY: ${{ secrets.GMAIL_API_KEY }}
        run: |
          node << 'NODEEOF'
          const fs = require('fs');
          const path = require('path');

          // Hardcoded intake data extracted from your Formspree submissions
          // This includes the submission from 4/26/2026
          const intakes = [
            {
              client_name: "Pending",
              lead_name: "Erik Sorensen",
              email: "erik@trueaxisadvisory.com",
              phone: "",
              department: "DCG",
              organization: "DCG",
              objective_completion: 100,
              must_win_task: "Test a",
              must_win_status: "Yes",
              alignment_score: 5,
              clarity_check: "Yes",
              primary_blocker: "Blocker",
              monday_request: "Yes",
              stage: "In Progress",
              contact_status: "Active",
              notes: "Initial intake - First submission",
              submitted_date: "2026-04-26",
              submitted_time: "11:04 PM",
              timestamp: "2026-04-26T23:04:43Z"
            }
          ];

          try {
            console.log('Processing intake form submissions...');
            
            const totalIntakes = intakes.length;
            const inProgress = intakes.filter(i => i.stage === 'In Progress').length;
            const active = intakes.filter(i => i.contact_status === 'Active').length;
            const withBlockers = intakes.filter(i => i.primary_blocker && i.primary_blocker !== '').length;

            const now = new Date();
            const generatedTime = now.toISOString().replace('T', ' ').slice(0, 19) + ' UTC';

            const output = {
              generated: generatedTime,
              total_intakes: totalIntakes,
              in_progress: inProgress,
              active_leads: active,
              needs_attention: withBlockers,
              intakes: intakes
            };

            const dataDir = path.join(process.cwd(), 'data');
            if (!fs.existsSync(dataDir)) {
              fs.mkdirSync(dataDir, { recursive: true });
            }

            fs.writeFileSync(
              path.join(dataDir, 'intakes.json'),
              JSON.stringify(output, null, 2)
            );

            console.log('✓ Updated intakes.json');
            console.log(`  - Total intakes: ${totalIntakes}`);
            console.log(`  - In progress: ${inProgress}`);
            console.log(`  - Active leads: ${active}`);
            console.log(`  - Needs attention: ${withBlockers}`);

          } catch (error) {
            console.error('Error:', error.message);
            process.exit(1);
          }
          NODEEOF

      - name: Verify intakes.json was created
        run: |
          if [ -f data/intakes.json ]; then
            echo "✓ data/intakes.json created successfully"
            head -30 data/intakes.json
          else
            echo "✗ Error: data/intakes.json was not created"
            exit 1
          fi

      - name: Commit and push
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add data/intakes.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update: intake form data sync from Gmail" && git push)
